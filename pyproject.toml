[project]
name = "espn-fantasy-mcp"
version = "0.1.0"
description = "Servidor MCP para gestionar una liga de ESPN Fantasy Football (NFL)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
espn-fantasy-mcp = "espn_fantasy_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/espn_fantasy_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
